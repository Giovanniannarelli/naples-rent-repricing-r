name: Assemble full R pipeline

on:
  push:
    branches: [main]
    paths:
      - 'payloads/**'
      - '.github/workflows/assemble-full-pipeline.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode source payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full_pipeline
          shopt -s nullglob
          for payload in payloads/*.gz.b64; do
            filename="$(basename "$payload" .gz.b64)"
            base64 --decode --ignore-garbage "$payload" | gzip --decompress > "full_pipeline/$filename"
          done

      - name: Commit assembled scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full_pipeline
          if git diff --cached --quiet; then
            echo "No assembled-script changes to commit."
            exit 0
          fi
          git commit -m "Add original V10 full-pipeline scripts"
          git push

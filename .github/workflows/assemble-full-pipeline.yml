name: Assemble full R pipeline

on:
  push:
    branches: [main]
    paths:
      - 'payloads/**'
      - '.github/workflows/assemble-full-pipeline.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode source payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full_pipeline
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          for payload in sorted(Path('payloads').glob('*.gz.b64')):
              name = payload.name[:-7]
              raw = payload.read_bytes()
              clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw).rstrip(b'=')
              clean += b'=' * ((4 - len(clean) % 4) % 4)
              try:
                  decoded = base64.b64decode(clean, validate=False)
                  source = gzip.decompress(decoded)
              except Exception as exc:
                  raise RuntimeError(f'Cannot decode {payload}: {exc}') from exc
              (Path('full_pipeline') / name).write_bytes(source)
              print(f'assembled {name}: {len(source)} bytes')
          PY

      - name: Commit assembled scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full_pipeline
          if git diff --cached --quiet; then
            echo "No assembled-script changes to commit."
            exit 0
          fi
          git commit -m "Add original V10 full-pipeline scripts"
          git push
